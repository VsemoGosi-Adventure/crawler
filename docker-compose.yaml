version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: redpanda-broker
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-topic-replications=1
      - --pandaproxy-addr=0.0.0.0:8082
      - --kafka-addr=0.0.0.0:9092
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adventure-net

  crawler:
    build:
      context: ./services/crawler
      dockerfile: Dockerfile
    container_name: crawler-service
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - CRAWLER_TOPIC=events.raw
      - CRAWLER_INTERVAL=30m
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - adventure-net
    restart: unless-stopped

networks:
  adventure-net:
    driver: bridge